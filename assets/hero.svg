<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Jibeom Ko</title>
  <desc id="d">Computational biology at KIST, Seoul. Illustration: long-read isoforms with novel splice junctions, each labelled supported, unconfirmed or artifact.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .lbl { font-size: 13px; fill: #7d8590; }
    .arc { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-dasharray: 1; animation: draw 1.1s ease-out backwards; }
    .chip { animation: fade .6s ease-out backwards; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="880" cy="180" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f6feb" stop-opacity=".16"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect y="336" width="1200" height="4" fill="url(#bar)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="339" rx="15.5" fill="none" stroke="#30363d"/>

  <g class="sans">
    <text class="mono" x="64" y="92" font-size="15" fill="#7d8590">jibeomko@kist<tspan fill="#484f58">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#484f58">$</tspan> whoami <tspan class="cursor" fill="#2dd4bf">▍</tspan></text>
    <text x="62" y="162" font-size="58" font-weight="700" fill="#e6edf3" letter-spacing="-1">Jibeom Ko</text>
    <text x="64" y="202" font-size="20" fill="#8b949e">Computational biology  ·  KIST, Seoul</text>
    <text x="64" y="250" font-size="18" fill="#c9d1d9">I build bioinformatics tools that <tspan fill="#2dd4bf">show their evidence.</tspan></text>
    <text class="mono" x="64" y="288" font-size="14" fill="#58a6ff">long-read RNA-seq <tspan fill="#484f58">·</tspan> multi-omics <tspan fill="#484f58">·</tspan> biomarker audit</text>
  </g>

  <line x1="596" y1="56" x2="596" y2="296" stroke="#21262d"/>
  <text class="mono" x="632" y="50" font-size="12" fill="#6e7681">// novel isoforms, adjudicated</text>
  <g>
    <text class="mono lbl" x="632" y="100">ref</text>
    <line x1="684" y1="96" x2="1044" y2="96" stroke="#30363d" stroke-width="1.5"/>
    <rect x="684" y="87" width="48" height="18" rx="3" fill="#484f58"/>
    <rect x="784" y="87" width="36" height="18" rx="3" fill="#484f58"/>
    <rect x="904" y="87" width="36" height="18" rx="3" fill="#484f58"/>
    <rect x="996" y="87" width="48" height="18" rx="3" fill="#484f58"/>
