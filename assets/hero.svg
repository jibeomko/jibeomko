    <rect x="684" y="147" width="48" height="18" rx="3" fill="#388bfd"/>
    <rect x="784" y="147" width="36" height="18" rx="3" fill="#388bfd"/>
    <rect x="996" y="147" width="48" height="18" rx="3" fill="#388bfd"/>
