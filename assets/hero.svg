    <path class="arc" style="animation-delay:0.3s" pathLength="1" d="M820 147 Q908 103.3 996 147" stroke="#3fb950"/>
    <g class="chip" style="animation-delay:1.15s"><rect x="1062" y="144" width="108" height="24" rx="12" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".6"/><text class="mono" x="1116" y="160" font-size="12" fill="#3fb950" text-anchor="middle">✓ supported</text></g>
    <text class="mono lbl" x="632" y="220">iso_B</text>
    <line x1="684" y1="216" x2="1044" y2="216" stroke="#30363d" stroke-width="1.5"/>
    <rect x="684" y="207" width="48" height="18" rx="3" fill="#388bfd"/>
    <rect x="784" y="207" width="36" height="18" rx="3" fill="#388bfd"/>
    <rect x="852" y="207" width="20" height="18" rx="3" fill="#d29922"/>
    <rect x="904" y="207" width="36" height="18" rx="3" fill="#388bfd"/>
    <rect x="996" y="207" width="48" height="18" rx="3" fill="#388bfd"/>
    <path class="arc" style="animation-delay:0.6s" pathLength="1" d="M732 207 Q758 185.6 784 207" stroke="#6e7681"/>
    <path class="arc" style="animation-delay:0.6s" pathLength="1" d="M820 207 Q836 189.2 852 207" stroke="#d29922"/>
    <path class="arc" style="animation-delay:0.6s" pathLength="1" d="M872 207 Q888 189.2 904 207" stroke="#d29922"/>
    <path class="arc" style="animation-delay:0.6s" pathLength="1" d="M940 207 Q968 184.9 996 207" stroke="#6e7681"/>
    <g class="chip" style="animation-delay:1.40s"><rect x="1062" y="204" width="108" height="24" rx="12" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".6"/><text class="mono" x="1116" y="220" font-size="12" fill="#d29922" text-anchor="middle">? unconfirmed</text></g>
    <text class="mono lbl" x="632" y="280">iso_C</text>
    <line x1="684" y1="276" x2="868" y2="276" stroke="#30363d" stroke-width="1.5"/>
    <rect x="684" y="267" width="48" height="18" rx="3" fill="#388bfd"/>
    <rect x="784" y="267" width="36" height="18" rx="3" fill="#388bfd"/>
    <rect x="844" y="267" width="24" height="18" rx="3" fill="#f85149"/>
    <text class="mono" x="874" y="280" font-size="11" fill="#f85149">AAAA</text>
    <path class="arc" style="animation-delay:0.9s" pathLength="1" d="M732 267 Q758 245.6 784 267" stroke="#6e7681"/>
    <path class="arc" style="animation-delay:0.9s" pathLength="1" d="M820 267 Q832 250.7 844 267" stroke="#f85149"/>
    <g class="chip" style="animation-delay:1.65s"><rect x="1062" y="264" width="108" height="24" rx="12" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".6"/><text class="mono" x="1116" y="280" font-size="12" fill="#f85149" text-anchor="middle">✗ artifact</text></g>
  </g>
</svg>
