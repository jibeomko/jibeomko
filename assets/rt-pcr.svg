  <title id="t">Isoform-specific RT-PCR</title>
  <desc id="d">Schematic: RNA is reverse-transcribed to cDNA, isoform-specific primers (one spanning the exon-skipping junction) amplify each isoform, products run on an agarose gel and band densitometry gives the isoform ratio.</desc>
